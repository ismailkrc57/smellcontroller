# Dokploy (Docker Compose) ile yayın için. Alan adı Dokploy arayüzünden
# "web" servisine, 80 portuna bağlanır; burada port yayınlanmaz.
# Domain ekledikten/değiştirdikten sonra mutlaka yeniden Deploy edin.
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SMELL_DEMO_EMAIL: ${SMELL_DEMO_EMAIL:-demo@smellcontrol.io}
      SMELL_DEMO_PASSWORD: ${SMELL_DEMO_PASSWORD:-smellcontrol}
    volumes:
      # Kullanıcılar, kayıtlar ve eğitilen modeller yeniden yayında korunur
      - smell-data:/app/data
    expose:
      - "8000"
    networks:
      default:
        # nginx bu isimle bağlanır; paylaşılan ağdaki başka "backend"lerle karışmaz
        aliases:
          - smellcontrol-api

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      # Dokploy'un Traefik'i trafiği bu ağ üzerinden "web" servisine iletir
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  smell-data:
