# SmellControl web: landing "/" + React dashboard "/app" + API proxy → backend
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 50m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Landing sayfası
  location = / {
    try_files /landing.html =404;
  }

  # React dashboard (SPA)
  location = /app {
    return 301 /app/;
  }
  location /app/ {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  # Backend API
  location ~ ^/(auth|sensor|recording|training|detection|health)(/|$) {
    proxy_pass http://smellcontrol-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Canlı sensör verisi (WebSocket)
  location /ws/ {
    proxy_pass http://smellcontrol-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Hash'li derleme çıktıları ve landing görselleri uzun süre önbelleklenir
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ~ ^/(media|cdn\.prod\.website-files\.com|cdn\.jsdelivr\.net|d3e54v103j8qbb\.cloudfront\.net)/ {
    expires 30d;
    add_header Cache-Control "public";
  }
}
